[package]
name = "zwotrainer"
version = "1.3.0"
description = "Lightweight indoor trainer for Zwift .zwo workouts and folder-based plans"
authors = ["SteffenR"]
license = "MIT"
homepage = "https://steffenr.github.io/zwo-trainer/"
repository = "https://github.com/steffenr/zwo-trainer"
edition = "2021"
rust-version = "1.90"

[lib]
name = "zwotrainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "form", "query", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
btleplug = "0.13"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
hmac = "0.13"
sha1 = "0.11"
base64 = "0.23"
percent-encoding = "2"
trash = "5"
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
