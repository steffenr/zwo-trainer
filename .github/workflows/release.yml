# zwoTrainer: one-click release (bump, tag, push)
name: Release

# One-click release. Run it from Actions -> "Release" -> "Run workflow" and pick a semantic
# bump (patch/minor/major). It:
#   0. runs the full CI (ci.yml: tests, clippy, JS tests, i18n/CSS/markup checks on Linux,
#      macOS and Windows); nothing is bumped or tagged unless all of it passes
#   1. reads the current version from src-tauri/Cargo.toml (the single source of truth)
#   2. bumps it and writes Cargo.toml + Cargo.lock (scripts/sync-version.mjs)
#   3. commits "chore(release): X", creates an annotated tag vX and pushes both in one
#      atomic push (the branch and the tag land together, or neither does)
# The tag push then triggers build-app.yml, which builds every platform and publishes the
# GitHub release with generated notes.
#
# Requires a repository secret RELEASE_PAT: a Personal Access Token (classic, or
# fine-grained with Contents: Read & write) whose owner may push to the release branch.
# The default GITHUB_TOKEN can't be used: pushes made with it don't trigger other
# workflows, so the tag would never start the build.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# One release at a time: a second run waits instead of racing for the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    # Releases are cut from develop only.
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Bump version and tag
    needs: checks
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history + tags so an existing tag is detected
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute next version
        id: version
        shell: bash
        run: |
          CURRENT=$(node scripts/sync-version.mjs)
          NEXT=$(CURRENT="${CURRENT}" BUMP="${{ github.event.inputs.bump }}" node -e '
            const [maj, min, pat] = process.env.CURRENT.split(/[.+-]/).map(Number);
            switch (process.env.BUMP) {
              case "major": console.log(`${maj + 1}.0.0`); break;
              case "minor": console.log(`${maj}.${min + 1}.0`); break;
              default: console.log(`${maj}.${min}.${pat + 1}`);
            }
          ')
          TAG="v${NEXT}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Bump manually or choose a different increment."
            exit 1
          fi
          {
            echo "next=${NEXT}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${CURRENT} -> ${NEXT} (tag ${TAG})"

      - name: Write version
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.next }}"

      - name: Commit, tag and push
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PAT }}
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): ${NEXT}"
          git tag -a "$TAG" -m "Release ${NEXT}"
          REMOTE="https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Atomic: if either ref is rejected, neither is updated, so a failed push can't leave
          # the version bump on the branch without its tag.
          git push --atomic "$REMOTE" "HEAD:refs/heads/${BRANCH}" "refs/tags/${TAG}"
          echo "Pushed ${BRANCH} and tag ${TAG}; build-app.yml will publish the release."
