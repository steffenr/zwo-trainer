name: Deploy site

# Publishes the website in site/ to GitHub Pages, always as of the latest release, so the site
# never describes features that aren't released yet (site changes on develop wait for it).
#  - after "Build zwoTrainer" has published a release (tag push) -> deploy site/ of that
#    release, so the download page names the new version once its installers are online
#  - workflow_dispatch -> redeploy the latest release; `ref` (e.g. develop) deploys another
#    branch or tag instead, for an urgent site fix
#
# workflow_run is used instead of a tag trigger: it runs on the default branch, which the
# github-pages environment allows, and only after the release assets exist. The tag to deploy
# comes from the releases API, not from the triggering run (CodeQL: untrusted checkout).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  workflow_run:
    workflows: ['Build zwoTrainer']
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (empty: the latest release)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site
    # for workflow_run: only successful release builds (tag pushes), not build-only runs
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The latest release's tag from the API (never the triggering workflow_run's commit: this
      # job runs with pages/id-token write and must not execute foreign code).
      - name: Pick the release to deploy
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.ref }}
        run: |
          REF="${WANT:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "Deploying ${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pick.outputs.ref }}
          persist-credentials: false

      - name: Setup Node (for the version script)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fill in the current version
        shell: bash
        run: |
          VERSION=$(node scripts/sync-version.mjs)
          echo "Site version: ${VERSION}"
          sed -i "s/&lt;version&gt;/${VERSION}/g" site/download.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
