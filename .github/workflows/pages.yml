name: Deploy site

# Publishes the website in site/ to GitHub Pages, always as of the latest release, so the site
# never describes features that aren't released yet (site changes on develop wait for it).
#  - called by "Build zwoTrainer" (build-app.yml) as its last job, after the release is
#    published -> deploy site/ of that tag, so the download page names the new version once its
#    installers are online
#  - workflow_dispatch -> redeploy the latest release; `ref` (e.g. develop) deploys another
#    branch or tag instead, for an urgent site fix
#
# No workflow_run: a privileged workflow_run that checks out and runs code from another run is
# what CodeQL's "untrusted checkout" flags. Called from the tag build, the checkout is the
# release's own tag.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"; the
# github-pages environment admits the branch develop (manual runs) and tags v* (release builds).

on:
  workflow_call:
    inputs:
      ref:
        description: 'Tag to deploy'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (empty: the latest release)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: deploy site
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # the given tag/branch, else the latest release's tag
      - name: Pick the release to deploy
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.ref }}
        run: |
          REF="${WANT:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          echo "Deploying ${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pick.outputs.ref }}
          persist-credentials: false

      - name: Setup Node (for the version script)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fill in the current version
        shell: bash
        run: |
          VERSION=$(node scripts/sync-version.mjs)
          echo "Site version: ${VERSION}"
          sed -i "s/&lt;version&gt;/${VERSION}/g" site/download.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
