# zwoTrainer: build all platforms and publish the release
name: Build zwoTrainer

# Builds the desktop app for macOS (Apple silicon + Intel), Windows and Linux.
#  - Push a tag like `v1.1.0` (usually done by release.yml) -> builds everything and
#    publishes a GitHub release with all installers and generated release notes.
#  - workflow_dispatch -> build-only run (no release); the installers are attached to the
#    workflow run as artifacts for testing.
#
# There is no npm project: the Tauri CLI is fetched with `npx` on demand, and the version
# lives only in src-tauri/Cargo.toml (see scripts/sync-version.mjs).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: '@tauri-apps/cli@^2'

jobs:
  build:
    name: build (${{ matrix.settings.name }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            test: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
            test: false # cross-compiled on an Apple-silicon runner; tests run in the arm64 job
          - platform: ubuntu-22.04
            target: ''
            name: linux-x64
            test: true
          - platform: windows-latest
            target: ''
            name: windows-x64
            test: true
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node (for the Tauri CLI and the version script)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.settings.name }}

      - name: Install Linux dependencies (Tauri v2 webkit2gtk-4.1, BlueZ/D-Bus for btleplug)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/sync-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Run tests
        if: matrix.settings.test
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        shell: bash
        run: |
          ARGS=()
          if [ -n "${{ matrix.settings.target }}" ]; then ARGS+=(--target "${{ matrix.settings.target }}"); fi
          npx --yes "$TAURI_CLI" build "${ARGS[@]}"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: zwotrainer-${{ matrix.settings.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # full history + tags so the notes can diff against the previous tag
          fetch-depth: 0

      - name: Collect installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: zwotrainer-*
          merge-multiple: true

      - name: Flatten installers
        # upload-artifact keeps the folder structure (…/release/bundle/dmg/x.dmg), so collect
        # the installers into one flat folder for the release upload
        shell: bash
        run: |
          mkdir -p release
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release/ \;
          ls -la release
          test -n "$(ls -A release)"

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate third-party notices
        # licences of every Rust crate in the installers (config: src-tauri/about.toml)
        working-directory: src-tauri
        run: cargo about generate --locked -c about.toml about.hbs -o ../release/THIRD-PARTY-NOTICES.html

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="$TAG"; fi
          NOTES=$(git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' | grep -vE 'chore\(release\):' || true)
          {
            echo 'Native installers for zwoTrainer. They are unsigned:'
            echo
            echo '- **macOS** (`_aarch64.dmg` for Apple silicon, `_x64.dmg` for Intel): right-click the app → Open on first launch (or System Settings → Privacy & Security → Open Anyway), then allow Bluetooth access.'
            echo '- **Windows** (`-setup.exe` or `.msi`): SmartScreen may warn — More info → Run anyway.'
            echo '- **Linux** (`.deb`, `.rpm` or `.AppImage`): needs BlueZ (`bluetoothd`) running.'
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              echo "${NOTES}"
              echo
              echo "**Full diff:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "## Changes"
              echo
              echo "${NOTES}"
            fi
          } > notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: zwoTrainer ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true
