version: 2
updates:
  # keep the workflow actions current (grouped into one PR)
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Rust crates of the Tauri app (src-tauri/Cargo.toml + Cargo.lock): minor and patch
  # updates in one PR, major updates (e.g. tauri, btleplug) one PR each so they can be
  # tested separately
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      crates:
        update-types: [minor, patch]
